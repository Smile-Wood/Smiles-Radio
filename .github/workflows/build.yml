# Builds the mod for every pull request and for pushes to non-main branches.
#
# Pushes to main are handled by publish.yml, which builds the same way and then
# publishes the result to Modrinth as a beta, so running this workflow there as
# well would only duplicate the build.
#
# The mod does not ship its prerequisite library, so Smile's Lib Box is checked
# out from its own repository and published to mavenLocal before building.

name: build
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: checkout prerequisite library
        uses: actions/checkout@v6
        with:
          repository: Smile-Wood/Smiles-Lib-Box
          path: .libbox
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew .libbox/gradlew
      - name: publish prerequisite library to mavenLocal
        working-directory: .libbox
        run: ./gradlew :1.20.1:publishToMavenLocal
      - name: build
        run: ./gradlew build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
          if-no-files-found: error
